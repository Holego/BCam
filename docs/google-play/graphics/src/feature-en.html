<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1024px;height:500px;overflow:hidden;font-family:'Inter',sans-serif;color:#E6E1E5;
       background:radial-gradient(900px 500px at 12% 50%,#3a2a2e 0%,#2B2930 45%,#1C1B1F 100%);position:relative}
  .tile{position:absolute;left:84px;top:140px;width:220px;height:220px;border-radius:52px;overflow:hidden;
        box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
  .dot{position:absolute;left:262px;top:152px;width:26px;height:26px;border-radius:50%;background:#D32F2F;
       box-shadow:0 0 0 7px rgba(211,47,47,.28)}
  .text{position:absolute;left:350px;top:0;height:500px;width:640px;display:flex;flex-direction:column;justify-content:center}
  h1{margin:0 0 18px;font-size:68px;font-weight:700;letter-spacing:-1px;line-height:1.05}
  p{margin:0;font-size:31px;line-height:1.3;color:#CAC4D0}
  .pill{margin-top:34px;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;
        background:rgba(211,47,47,.2);border:1.5px solid rgba(211,47,47,.7);color:#FFB4AB;
        border-radius:999px;padding:10px 24px;font-size:24px;font-weight:600}
  .pill i{width:14px;height:14px;border-radius:50%;background:#D32F2F;display:block}
</style>
<div class="tile"><img src="../icon-512.png" width="220" height="220"></div>
<div class="dot"></div>
<div class="text"><h1>Background Camera</h1><p>Record video from a home-screen widget</p><span class="pill"><i></i>No need to open the app</span></div>
